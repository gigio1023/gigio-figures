  <g data-id="stage"><rect class="box" x="40" y="422" width="80" height="36"/><text class="t" x="80" y="440" text-anchor="middle" dominant-baseline="central">I</text></g>
  <g data-id="stage"><rect class="box" x="440" y="482" width="120" height="36"/><text class="t" x="500" y="500" text-anchor="middle" dominant-baseline="central">J</text></g>
  <path class="spine" data-id="bus" d="M660 440V700" data-arrow="end"/>
