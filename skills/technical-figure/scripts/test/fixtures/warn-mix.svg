  <g data-id="e"><rect class="box" x="300" y="136" width="120" height="36"/><text class="t" x="360" y="154" text-anchor="middle" dominant-baseline="central">E</text></g>
  <g data-id="f"><rect class="box" x="300" y="300" width="120" height="36"/><text class="t" x="360" y="318" text-anchor="middle" dominant-baseline="central">F</text></g>
  <g data-id="g"><rect class="box" x="100" y="218" width="120" height="36"/><text class="t" x="160" y="236" text-anchor="middle" dominant-baseline="central">G</text></g>
  <g data-id="h"><rect class="box" x="500" y="218" width="120" height="36"/><text class="t" x="560" y="236" text-anchor="middle" dominant-baseline="central">H</text></g>
